# 复制到 .github/workflows/publish-changelog.yml 即可启用。
# 仓库保持私有；Secrets 里配置 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、CF_PAGES_PROJECT。
name: Publish changelog
on:
  # 只改更新日志也同步：push 到 CHANGELOG.md 就部署，不需要打 tag。
  push:
    paths: ["CHANGELOG.md"]
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        run: python tools/make_changelog.py --from-changelog CHANGELOG.md --out release/public/changelog.json
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy release/public --project-name="${{ secrets.CF_PAGES_PROJECT }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
