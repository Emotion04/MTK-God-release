# 打 tag 即发布：构建 → 生成发布用 JSON → 推送到**公开产物仓库** → 建 Release。
#
# 源码仓库可以是私有的；App 只读公开的产物仓库 MTK-God-release：
#   https://github.com/Emotion04/MTK-God-release/releases/latest/download/app-release.apk
#   https://raw.githubusercontent.com/Emotion04/MTK-God-release/main/{update,changelog,remote-config}.json
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   SIGNING_KEYSTORE_BASE64   release 签名 .jks 的 base64（certutil -encode 或 base64 -w0）
#   SIGNING_STORE_PASSWORD    keystore.properties 里的 storePassword
#   SIGNING_KEY_ALIAS         keyAlias
#   SIGNING_KEY_PASSWORD      keyPassword
#   RELEASE_REPO_TOKEN        只授权 MTK-God-release 的 Contents: Read and write PAT
# 签名密钥绝不能提交进仓库；本地构建仍读 mtk-optimizer/signing/keystore.properties。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.6.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p mtk-optimizer/signing
          echo "$KEYSTORE_BASE64" | base64 -d > mtk-optimizer/signing/canary-release.jks
          cat > mtk-optimizer/signing/keystore.properties <<PROPS
          storeFile=canary-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          PROPS

      - name: 构建 release APK
        working-directory: mtk-optimizer
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 生成发布用 JSON（changelog / update / remote-config）
        run: python tools/release_updates.py --tag "$TAG"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          # gh 默认在 GITHUB_REPOSITORY 里建 Release；这里显式指定公开产物仓库。
          export GH_REPO=Emotion04/MTK-God-release
          # 资产名固定为 app-release.apk，latest/download/app-release.apk 才能一直指向最新包。
          cp mtk-optimizer/app/build/outputs/apk/release/app-release.apk /tmp/app-release.apk
          python -c "import json;print(json.load(open('release/public/update.json',encoding='utf-8'))['notes'])" > /tmp/notes.txt
          gh release create "$TAG" /tmp/app-release.apk --title "$VERSION" --notes-file /tmp/notes.txt

      - name: 把发布用 JSON 推送到公开产物仓库
        env:
          TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Emotion04/MTK-God-release.git" /tmp/public
          cd /tmp/public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/release/public/update.json" update.json
          cp "$GITHUB_WORKSPACE/release/public/changelog.json" changelog.json
          cp "$GITHUB_WORKSPACE/release/public/remote-config.json" remote-config.json
          git add update.json changelog.json remote-config.json
          git diff --cached --quiet || git commit -m "release: $TAG"
          git push origin HEAD:main

      - name: 在源码仓库留下一份发布快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/public/changelog.json release/public/update.json release/public/remote-config.json
          git diff --cached --quiet || git commit -m "chore(release): $TAG 的发布文件"
          git push origin HEAD:${{ github.event.repository.default_branch }}
